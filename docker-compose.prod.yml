# Producción en el VPS compartido con el SGA y FadeApp.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Ningún puerto publicado: el nginx del SGA (80/443 y HTTPS) le pasa el tráfico
# por la red de Docker del SGA, donde el nginx de la API tiene el alias
# `api-rest-web`. La base de datos no sale de la red interna del proyecto.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    container_name: api_rest_app
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      LOG_CHANNEL: stderr
      SESSION_DRIVER: array
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]

  nginx:
    image: nginx:1.27-alpine
    container_name: api_rest_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks:
      interna:
      proxy:
        aliases: [api-rest-web]

  db:
    image: postgres:16-alpine
    container_name: api_rest_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-api_rest}
      POSTGRES_USER: ${DB_USERNAME:-api_rest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?hace falta DB_PASSWORD en .env.production}
    volumes:
      - api_rest_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interna]

volumes:
  api_rest_db:

networks:
  interna:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-sga_sga_network}
