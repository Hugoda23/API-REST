# Desarrollo local:  docker compose up -d --build
# API en http://localhost:3010/api  ·  Postgres en localhost:5436

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: api_rest_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks: [api_rest]

  nginx:
    image: nginx:1.27-alpine
    container_name: api_rest_nginx
    restart: unless-stopped
    ports:
      - "3010:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [api_rest]

  db:
    image: postgres:16-alpine
    container_name: api_rest_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: api_rest
      POSTGRES_USER: api_rest
      POSTGRES_PASSWORD: secret
    ports:
      - "5436:5432"
    volumes:
      - api_rest_db:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_rest -d api_rest"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [api_rest]

volumes:
  api_rest_db:

networks:
  api_rest:
